version: "3.8"

services:
  mensabot:
    image: jaykay23/mensabot:latest
    container_name: mensabot
    environment:
      - MENSABOT_TOKEN=${MENSABOT_TOKEN}
      - TZ=Europe/Berlin
    volumes:
      - mensabot_data:/app/db
    restart: unless-stopped

  mensabot-watchtower:
    image: containrrr/watchtower
    container_name: mensabot-watchtower
    command: mensabot
    environment:
      - TZ=Europe/Berlin
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mensabot_data:
